  "semconv_experimental",
] }
opentelemetry-resource-detectors = "0.9"
tracing-subscriber = { version = "0.3", features = [
  "env-filter",
  "fmt",
  "json",
  "registry",
] }
tracing-appender = "0.2.3"
tracing-error = "0.2"

[dev-dependencies]
reqwest.workspace = true

